<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in · EmoBooks-Gemini</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/static/style.css?v=2">
<style>
  .login-wrap { min-height: calc(100vh - 130px); display: flex; align-items: center;
                justify-content: center; padding: 24px; }
  .login-card { background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.05);
                padding: 32px 36px; width: 100%; max-width: 380px; }
  .login-card h2 { margin: 0 0 4px; font-size: 18px; color: #2d5a3d; }
  .login-card p.sub { margin: 0 0 20px; font-size: 13px; color: #888; }
  .login-card label { display: block; font-size: 12px; color: #555; margin: 14px 0 6px; }
  .login-card input { width: 100%; padding: 11px 14px; border: 1px solid #ccd;
                      border-radius: 8px; font-size: 14px; }
  .login-card input:focus { outline: none; border-color: #4a7c59; }
  .login-card button { width: 100%; margin-top: 20px; padding: 12px; background: #2d5a3d;
                       color: #fff; border: 0; border-radius: 8px; font-size: 14px;
                       cursor: pointer; }
  .login-card button:hover { filter: brightness(1.05); }
  .login-error { margin-top: 14px; background: #fdecea; color: #a33a2f; font-size: 13px;
                 padding: 10px 12px; border-radius: 8px; }
</style>
</head>
<body>
<header>
  <h1>EmoBooks-Gemini</h1>
  <p>Stylistic-Semantic Knowledge Graph for Sinhala Literature · Gemini + Neo4j</p>
</header>
<div class="login-wrap">
  <form class="login-card" method="post" action="/login">
    <h2>Sign in</h2>
    <p class="sub">Enter your credentials to open the library.</p>
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" autofocus required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    {% if error %}<div class="login-error">Incorrect username or password. Please try again.</div>{% endif %}
    <button type="submit">Sign in</button>
  </form>
</div>
</body>
</html>
